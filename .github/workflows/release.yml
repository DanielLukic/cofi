name: Release

on:
  push:
    branches: [ release ]

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libx11-dev libjson-glib-dev build-essential
    
    - name: Build release binary
      run: |
        make clean
        make BUILD_NUMBER=${{ github.run_number }} CFLAGS="-O2 -Wall -Wextra -Wno-deprecated-declarations -MMD -MP $(pkg-config --cflags gtk+-3.0 x11 gio-2.0 json-glib-1.0) -DBUILD_NUMBER=${{ github.run_number }}"
        strip cofi
    
    - name: Get version
      id: version
      run: |
        echo "VERSION=1.0.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
    
    - name: Rename binary for upload
      run: cp cofi cofi-linux-x64

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: COFI v${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        files: cofi-linux-x64
        body: |
          COFI Window Switcher v${{ steps.version.outputs.VERSION }}

          ## Changes
          - Automated release from the release branch

          ## Installation

          Download the binary and make it executable:
          ```bash
          chmod +x cofi-linux-x64
          sudo mv cofi-linux-x64 /usr/local/bin/cofi
          ```

          ## Requirements
          - GTK3 runtime libraries
          - X11-based Linux desktop environment
